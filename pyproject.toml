[project]
name = "nightreign-relics"
version = "0.1.0"
description = "Decrypts an Elden Ring Nightreign save, dumps owned Relics annotated with Hero compatibility, and hands the result to an LLM for Vessel/Relic loadout recommendations."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40.0"]

[project.scripts]
nightreign-relics = "nightreign_relics.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nightreign_relics"]

[tool.hatch.build.targets.wheel.force-include]
"resources" = "nightreign_relics/resources"

[tool.pytest.ini_options]
testpaths = ["tests"]
